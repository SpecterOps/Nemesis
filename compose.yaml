  # file-enrichment-2:
  #   <<: *file-enrichment-template
  #   environment:
  #     <<: *file-enrichment-environment
  #     APP_ID: file-enrichment-2
  # file-enrichment-2-dapr:
  #   <<: *file-enrichment-dapr-template
  #   depends_on:
  #     file-enrichment-2: { condition: service_started }
  #     scheduler: { condition: service_started }
  #     rabbitmq: { condition: service_healthy }
  #   network_mode: "service:file-enrichment-2"

  # file-enrichment-3:
  #   <<: *file-enrichment-template
  #   environment:
  #     <<: *file-enrichment-environment
  #     APP_ID: file-enrichment-3
  # file-enrichment-3-dapr:
  #   <<: *file-enrichment-dapr-template
  #   depends_on:
  #     file-enrichment-3: { condition: service_started }
  #     scheduler: { condition: service_started }
  #     rabbitmq: { condition: service_healthy }
  #   network_mode: "service:file-enrichment-3"

  frontend:
    image: ghcr.io/specterops/nemesis/frontend:latest
    depends_on: [postgres, hasura]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 10s
      retries: 3

  jupyter:
    profiles: ["jupyter"]
    image: ghcr.io/specterops/nemesis/jupyter:latest
    depends_on: [postgres, hasura]
    environment:
      # No HASURA_ADMIN_SECRET: notebooks use Hasura's limited operator role, so code running in
      # Jupyter cannot reach admin-only APIs (run_sql, metadata).
      - HASURA_GRAPHQL_URL=http://hasura:8080/v1/graphql
      - JUPYTER_PASSWORD=${JUPYTER_PASSWORD:-}
    volumes:
      - "./projects/jupyter/notebooks:/home/jovyan/work"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/jupyter/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  alerting:
    image: ghcr.io/specterops/nemesis/alerting:latest
    environment:
      - DAPR_HTTP_PORT=3508
      - DAPR_GRPC_PORT=50008
      - APPRISE_URLS=${APPRISE_URLS:-}
      - NEMESIS_URL=${NEMESIS_URL:?}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    logging: *logging-config
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      hasura: { condition: service_healthy }
    healthcheck: &healthcheck-python-svc
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
  alerting-dapr:
    image: "daprio/daprd:1.19.2"
    command:
      [
        "./daprd",
        "--max-body-size",
        "1Gi",
        "--app-id",
        "alerting",
        "--app-port",
        "8000",
        "--dapr-http-port",
        "3508",
        "--dapr-grpc-port",
        "50008",
        "--scheduler-host-address",
        "scheduler:50007",
        "--resources-path",
        "/dapr/components",
        "--log-level",
        "${DAPR_LOG_LEVEL:-info}",
        "--config",
        "/dapr/configuration/config.yaml",
        "--enable-metrics",
        "--dapr-graceful-shutdown-seconds",
        "5",
      ]
    volumes:
      - ./infra/dapr/components/pubsub/alerting.yaml:/dapr/components/alerting.yaml:ro
      - ./infra/dapr/components/secretstore.yaml:/dapr/components/secretstore.yaml:ro
      - ./infra/dapr/configuration/general_monitoring_${NEMESIS_MONITORING:-disabled}.yaml:/dapr/configuration/config.yaml:ro
    environment:
      - RABBITMQ_CONNECTION_STRING=amqp://${RABBITMQ_USER_URLENC:-${RABBITMQ_USER}}:${RABBITMQ_PASSWORD_URLENC:-${RABBITMQ_PASSWORD}}@rabbitmq:5672
      - HASURA_ADMIN_SECRET=${HASURA_ADMIN_SECRET:?HASURA_ADMIN_SECRET must be set in .env - tools/nemesis-ctl.sh generates one}
    depends_on:
      alerting: { condition: service_started }
      scheduler: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    network_mode: "service:alerting"

  housekeeping:
    image: ghcr.io/specterops/nemesis/housekeeping:latest
    environment:
      - APP_ID=housekeeping
      - CLEANUP_SCHEDULE=*/5 * * * * # Every 5 minutes
      - DAPR_GRPC_PORT=50011
      - DAPR_HTTP_PORT=3510
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    logging: *logging-config
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *healthcheck-python-svc
  housekeeping-dapr:
    image: "daprio/daprd:1.19.2"
    command:
      [
        "./daprd",
        "--max-body-size",
        "1Gi",
        "--app-id",
        "housekeeping",
        "--app-port",
        "8000",
        "--dapr-http-port",
        "3510",
        "--dapr-grpc-port",
        "50011",
        "--scheduler-host-address",
        "scheduler:50007",
        "--resources-path",
        "/dapr/components",
        "--log-level",
        "${DAPR_LOG_LEVEL:-info}",
        "--config",
        "/dapr/configuration/config.yaml",
        "--enable-metrics",
        "--dapr-graceful-shutdown-seconds",
        "5",
      ]
    volumes:
      - ./infra/dapr/components/secretstore.yaml:/dapr/components/secretstore.yaml:ro
      - ./infra/dapr/components/workflowstate.yaml:/dapr/components/workflowstate.yaml:ro
      - ./infra/dapr/configuration/general_monitoring_${NEMESIS_MONITORING:-disabled}.yaml:/dapr/configuration/config.yaml:ro
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      # Dapr state store: a URL with encoded credentials (its separate user/password fields are not escaped)
      - POSTGRES_STATESTORE_URL=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}?${POSTGRES_PARAMETERS:-sslmode=disable}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-enrichment}
      - POSTGRES_PARAMETERS=${POSTGRES_PARAMETERS:-sslmode=disable}
    depends_on:
      housekeeping: { condition: service_started }
      scheduler: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    network_mode: "service:housekeeping"

  document-conversion:
    image: ghcr.io/specterops/nemesis/document-conversion:latest
    volumes:
      - ./infra/tika/tika-config${TIKA_USE_OCR:+-tesseract}.json:/tika-config.json:ro
    environment:
      - APP_ID=document-conversion
      - DAPR_GRPC_PORT=50002
      - DAPR_HTTP_PORT=3501
      - NEMESIS_MONITORING=${NEMESIS_MONITORING:-disabled}
      - TIKA_CONFIG=/tika-config.json
      # If you want to have additional language packs supported (see https://github.com/tesseract-ocr/tessdata for a full list):
      #   $ export TIKA_OCR_LANGUAGES="eng chi_sim chi_tra jpn rus deu spa"
      # To change the default:
      #   - TIKA_OCR_LANGUAGES=${TIKA_OCR_LANGUAGES:-eng chi_sim chi_tra jpn rus deu spa}
      # Note: each package installed will increase the image size!
      - TIKA_OCR_LANGUAGES=${TIKA_OCR_LANGUAGES:-eng}
      - MAX_PARALLEL_WORKFLOWS=${DOCUMENTCONVERSION_WORKERS:-5}
      - MAX_WORKFLOW_EXECUTION_TIME=${MAX_WORKFLOW_EXECUTION_TIME:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OMP_THREAD_LIMIT=1 # Limit the number of tesseract instances
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging-config
    depends_on:
      postgres: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "2"
  document-conversion-dapr:
    image: "daprio/daprd:1.19.2"
    command:
      [
        "./daprd",
        "--max-body-size",
        "1Gi",
        "--app-id",
        "document-conversion",
        "--app-port",
        "8000",
        "--dapr-http-port",
        "3501",
        "--dapr-grpc-port",
        "50002",
        "--scheduler-host-address",
        "scheduler:50007",
        "--resources-path",
        "/dapr/components",
        "--log-level",
        "${DAPR_LOG_LEVEL:-info}",
        "--config",
        "/dapr/configuration/document_conversion_monitoring_${NEMESIS_MONITORING:-disabled}.yaml",
        "--enable-metrics",
        "--dapr-graceful-shutdown-seconds",
        "5",
      ]
    volumes:
      - ./infra/dapr/components/pubsub/document_conversion.yaml:/dapr/components/document_conversion.yaml:ro
      - ./infra/dapr/components/pubsub/files.yaml:/dapr/components/files.yaml:ro
      - ./infra/dapr/components/secretstore.yaml:/dapr/components/secretstore.yaml:ro
      - ./infra/dapr/components/workflowstate.yaml:/dapr/components/workflowstate.yaml:ro
      - ./infra/dapr/configuration/:/dapr/configuration/
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      # Dapr state store: a URL with encoded credentials (its separate user/password fields are not escaped)
      - POSTGRES_STATESTORE_URL=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}?${POSTGRES_PARAMETERS:-sslmode=disable}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-enrichment}
      - POSTGRES_PARAMETERS=${POSTGRES_PARAMETERS:-sslmode=disable}
      - RABBITMQ_CONNECTION_STRING=amqp://${RABBITMQ_USER_URLENC:-${RABBITMQ_USER}}:${RABBITMQ_PASSWORD_URLENC:-${RABBITMQ_PASSWORD}}@rabbitmq:5672
    depends_on:
      document-conversion: { condition: service_started }
      scheduler: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    network_mode: "service:document-conversion"

  gotenberg:
    # 9.x drops the bundled JRE (Java4Shell, CVE-2026-114938)
    image: gotenberg/gotenberg:9.10.3
    command:
      [
        "gotenberg",
        "--api-timeout=180s",
        "--libreoffice-restart-after=5",
        "--libreoffice-auto-start=true",
        # SSRF hardening: rendered HTML/documents are attacker-influenced, so the
        # renderer gets no network egress. Chromium may only load the uploaded
        # files under Gotenberg's /tmp work dir (no http/https/ws, loopback,
        # 169.254.0.0/16, RFC1918 or public hosts); JS is off (templates use none).
        # LibreOffice (HTML-linked stylesheets) is denied all hosts, and the
        # downloadFrom/webhook features (unused by Nemesis) are disabled.
        "--chromium-allow-list=^file:///tmp/",
        "--chromium-deny-list=^(?!file:///tmp/)",
        "--chromium-deny-private-ips=true",
        "--chromium-deny-public-ips=true",
        "--chromium-disable-javascript=true",
        "--libreoffice-deny-private-ips=true",
        "--libreoffice-deny-public-ips=true",
        "--api-disable-download-from=true",
        "--webhook-disable=true",
      ]
    environment:
      DISABLE_GOOGLE_CHROME: "1"
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  gotenberg-dapr:
    image: "daprio/daprd:1.19.2"
    command:
      [
        "./daprd",
        "--max-body-size",
        "1Gi",
        "--app-id",
        "gotenberg",
        "--app-port",
        "3000",
        "--dapr-http-port",
        "3505",
        "--dapr-grpc-port",
        "50005",
        "--scheduler-host-address",
        "scheduler:50007",
        "--resources-path",
        "/dapr/components",
        "--log-level",
        "${DAPR_LOG_LEVEL:-info}",
        "--config",
        "/dapr/configuration/config.yaml",
        "--enable-metrics",
        "--dapr-graceful-shutdown-seconds",
        "5",
      ]
    volumes:
      - ./infra/dapr/configuration/general_monitoring_${NEMESIS_MONITORING:-disabled}.yaml:/dapr/configuration/config.yaml:ro
      - empty:/dapr/components:ro

    depends_on:
      gotenberg: { condition: service_started }
      scheduler: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    network_mode: "service:gotenberg"

  ############################
  # Infrastructure Services
  ############################
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    # 1 GB volumes: -volume.max=0 sizes the volume count from free disk / volume size, and each bucket
    # (collection) needs its own volume, so the 30 GB default left too few volumes on smaller disks
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.port=9333 -master.volumeSizeLimitMB=1024 -volume.port=8080 -volume.max=0 -metricsPort=9324 -dir=/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/status"]
      interval: 30s
      timeout: 20s
      retries: 3

  seaweedfs-init:
    image: amazon/aws-cli:2.42.5
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "aws --endpoint-url http://seaweedfs:8333 s3 mb s3://loki-data --region us-east-1 2>/dev/null; aws --endpoint-url http://seaweedfs:8333 s3 mb s3://files --region us-east-1 2>/dev/null; echo 'SeaweedFS bucket initialization complete.'; true",
      ]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.4.1-management
    hostname: rabbitmq-node # have to do this for persistence reasons
    environment:
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq_management path_prefix "/rabbitmq"
      - RABBITMQ_NODENAME=rabbit@rabbitmq-node # have to do this for persistence reasons
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:18.7
    command:
      [
        "postgres",
        "-c",
        "max_connections=200",
        "-c",
        "shared_buffers=1GB",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "tcp_keepalives_idle=5",
        "-c",
        "tcp_keepalives_interval=2",
        "-c",
        "tcp_keepalives_count=3",
      ]
    # Parallel query workers allocate dynamic shared memory in /dev/shm; Docker's 64MB default
    # fails large sorts/aggregates with "could not resize shared memory segment"
    shm_size: 1g
    # ports:
    #   - "${POSTGRES_EXTERNAL_PORT:-}5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enrichment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d enrichment"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.21.1
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER:?}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD:?}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}?${POSTGRES_PARAMETERS:-sslmode=disable}"
    volumes:
      - ./infra/postgres-exporter/postgres_exporter.yml:/postgres_exporter.yml:ro
    depends_on:
      postgres: { condition: service_healthy }

  hasura:
    image: hasura/graphql-engine:v2.51.9.cli-migrations-v2
    # The image no longer ships a HEALTHCHECK (it did up to v2.48); services wait on service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_ADMIN_SECRET:?HASURA_ADMIN_SECRET must be set in .env - tools/nemesis-ctl.sh generates one}"
      HASURA_GRAPHQL_BASE_PATH: "/hasura"
      HASURA_GRAPHQL_DATABASE_URL: postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLE_METADATA_SYNC: "true"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_LOG_LEVEL: "warn"
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      # Requests without the admin secret (the web UI) get the restricted `operator` role defined in
      # infra/hasura/metadata/tables.yaml: read access plus the UI's own writes, no SQL/metadata API.
      # Services, Jupyter and the CLI keep using the admin secret on hasura:8080.
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: operator
      # The UI and Jupyter reach Hasura from the same origin (/hasura via Traefik) or server-side, so
      # no CORS headers: pages on other sites can't call it from a browser
      HASURA_GRAPHQL_DISABLE_CORS: "true"
    volumes:
      - ./infra/hasura/metadata:/hasura-metadata:ro

  traefik:
    image: traefik:v3.8.0
    command:
      # - "--log.level=DEBUG"
      - "--log.level=WARN"
      # Access log (JSON, to stdout; promtail ships it to Loki with --monitoring): who requested what, and failed
      # logins (401). Request headers are dropped by default, so the Authorization header is never logged.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      # Routes, middlewares and TLS all come from infra/traefik/config (routes.yml): no Docker provider, so Traefik
      # needs no access to the Docker socket
      - "--providers.file=true"
      - "--providers.file.directory=/config"
      - "--providers.file.watch=true"
      - "--entrypoints.websecure.address=:443"
      # Metrics for Prometheus on an internal-only entrypoint (not published); no API/dashboard is served
      - "--entrypoints.metrics.address=:8082"
      # Drop request headers whose names alias another one (X_Auth_User or X.Auth.User for X-Auth-User), so a client
      # can't smuggle a header that a backend reads under the name of a header Traefik manages
      - "--entrypoints.websecure.http.aliasheadersstrategy=delete"
      - "--entrypoints.metrics.http.aliasheadersstrategy=delete"
      # Encoded characters in request paths: no backend needs an encoded NUL or backslash, so reject those; keep the
      # rest, which the RabbitMQ UI (vhost "/" as %2F) and Jupyter (file names) put into paths
      - "--entrypoints.websecure.http.encodedcharacters.allowencodednullcharacter=false"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedbackslash=false"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedslash=true"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedsemicolon=true"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedpercent=true"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedquestionmark=true"
      - "--entrypoints.websecure.http.encodedcharacters.allowencodedhash=true"
      # The metrics entrypoint only serves /metrics: no encoded characters at all
      - "--entrypoints.metrics.http.encodedcharacters.allowencodednullcharacter=false"
      - "--entrypoints.metrics.http.encodedcharacters.allowencodedbackslash=false"
      - "--entrypoints.metrics.http.encodedcharacters.allowencodedslash=false"
      - "--entrypoints.metrics.http.encodedcharacters.allowencodedsemicolon=false"
      - "--entrypoints.metrics.http.encodedcharacters.allowencodedpercent=false"
      - "--entrypoints.metrics.http.encodedcharacters.allowencodedquestionmark=false"
      - "--entrypoints.metrics.http.encodedcharacters.allowencodedhash=false"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
    environment:
      # Used by infra/traefik/config/auth.yml (the Nemesis login)
      - BASIC_AUTH_USERS=${BASIC_AUTH_USERS:-n:$$apr1$$RbnOjtKr$$S706SPJ3KzCKIref.gRFT.}
      - NEMESIS_PORT=${NEMESIS_PORT:-7443}
      # Used by infra/traefik/config/rabbitmq.yml to log the RabbitMQ UI in behind the Nemesis login
      - RABBITMQ_USER=${RABBITMQ_USER:?}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?}
    ports: ["${NEMESIS_PORT:-7443}:443"]
    volumes:
      - ./auth:/auth:ro
      - ./infra/traefik/certs:/certs:ro
      - ./infra/traefik/config:/config:ro

  scheduler-init:
    image: busybox:1.38.0
    user: "0:0"
    command: >
      sh -c "
        mkdir -p /data/default-dapr-scheduler-server-0 &&
        chown -R 65532:65532 /data &&
        chmod -R 755 /data
      "
    volumes:
      - scheduler_data:/data
    restart: "no"

  scheduler:
    image: "daprio/scheduler:1.19.2"
    command:
      [
        "./scheduler",
        "--port",
        "50007",
        # Dapr 1.19: the Scheduler also places actors (workflows run on actors), so there is no
        # separate Placement service; sidecars learn this from the Scheduler
        "--placement-enabled=true",
        "--etcd-data-dir=/data",
        "--enable-metrics",
        "--log-level",
        "${DAPR_LOG_LEVEL:-info}",
      ]
    depends_on:
      postgres: { condition: service_healthy }
      scheduler-init: { condition: service_completed_successfully }
    volumes:
      - scheduler_data:/data

  ############################
  # Monitoring Services (optional profile)
  ############################

  otel-collector:
    profiles: ["monitoring"]
    image: otel/opentelemetry-collector:0.166.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      jaeger: { condition: service_healthy }

  jaeger:
    profiles: ["monitoring"]
    image: jaegertracing/jaeger:2.23.0
    user: "0:0"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    environment:
      - GOGC=80
    volumes:
      - ./infra/jaeger/jaeger-config.yaml:/etc/jaeger/config.yaml
      - jaeger_data:/badger # Persist trace data
    command: ["--config", "/etc/jaeger/config.yaml"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:13133/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.7.11
    command:
      ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - ./infra/loki:/etc/loki:ro
      - loki_data:/loki
    depends_on: [seaweedfs-init]
    # No healthcheck: the Loki 3.7 image is distroless (no shell, wget or curl), and nothing
    # waits on Loki being healthy. Kubernetes probes /ready over HTTP instead.

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.6.11
    user: "0:0"
    volumes:
      - ./infra/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      ["-config.file=/etc/promtail/config.yaml", "-config.expand-env=true"]
    depends_on: [loki]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.2
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # Viewer, not Editor: Explore (ad-hoc Loki/Postgres queries over every container's logs) stays off
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-Qwerty12345}
      # - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-nemesis}
      - GF_SERVER_DOMAIN=${EXTERNAL_HOST:-https://localhost}
      - GF_SERVER_ROOT_URL=${EXTERNAL_HOST:-https://localhost}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - POSTGRES_CONNECTION_STRING=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}?${POSTGRES_PARAMETERS:-sslmode=disable}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:3000/"]
      interval: 10s

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--web.external-url=/prometheus/",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9090/prometheus/-/healthy",
        ]
      interval: 10s

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      [
        "--path.procfs=/host/proc",
        "--path.rootfs=/rootfs",
        "--path.sysfs=/host/sys",
        "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)",
      ]

  cadvisor:
    profiles: ["monitoring"]
    image: ghcr.io/google/cadvisor:v0.61.1
    restart: unless-stopped
    privileged: true
    command:
      - "--housekeeping_interval=30s"
      - "--storage_duration=2m0s"
      - "--docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /dev/disk/:/dev/disk:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run:/var/run:ro
    devices: ["/dev/kmsg:/dev/kmsg"]

  ############################
  # LLM Services (optional profile)
  ############################

  agents:
    profiles: ["llm"]
    image: ghcr.io/specterops/nemesis/agents:latest
    environment:
      - DAPR_HTTP_PORT=3509
      - DAPR_GRPC_PORT=50009
      - NEMESIS_URL=${NEMESIS_URL:?}
      - WORKFLOW_RUNTIME_LOG_LEVEL=${WORKFLOW_RUNTIME_LOG_LEVEL:-WARNING}
      - WORKFLOW_CLIENT_LOG_LEVEL=${WORKFLOW_CLIENT_LOG_LEVEL:-WARNING}
      - LITELLM_ADMIN_KEY=sk-${LITELLM_ADMIN_PASSWORD:?LITELLM_ADMIN_PASSWORD must be set in .env - tools/nemesis-ctl.sh generates one}
      - MAX_BUDGET=${LLM_MAX_BUDGET:-100}
      - BUDGET_DURATION=${LLM_BUDGET_DURATION:-30d}
      - DOTNET_ANALYSIS_RUN_REQUEST_LIMIT=${DOTNET_ANALYSIS_RUN_REQUEST_LIMIT:-25} # max LLM calls to use per .NET program analysis run
      - DOTNET_ANALYSIS_RUN_TOKENS_LIMIT=${DOTNET_ANALYSIS_RUN_TOKENS_LIMIT:-1000000} # max tokens to use per .NET program analysis run
      # if we hit this number of the same triage values for the same file, all future findings get that value
      - TRIAGE_CONSENSUS_THRESHOLD=${TRIAGE_CONSENSUS_THRESHOLD:-3}
      # Phoenix LLM tracing configuration
      - PHOENIX_ENABLED=${PHOENIX_ENABLED:-false}
      - PHOENIX_ENDPOINT=${PHOENIX_ENDPOINT:-http://phoenix:6006/v1/traces}
      - PHOENIX_SQL_DATABASE_URL=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/phoenix
      - NEMESIS_MONITORING=${NEMESIS_MONITORING:-disabled}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT_INSECURE=true
      # Chatbot configuration
      - CHATBOT_DB_PASSWORD=${CHATBOT_DB_PASSWORD:-chatbot_pass_change_me}
      - MCP_MAX_RESULTS=${MCP_MAX_RESULTS:-100}
    logging: *logging-config
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      hasura: { condition: service_healthy }
      litellm: { condition: service_healthy }
    healthcheck: *healthcheck-python-svc
  agents-dapr:
    profiles: ["llm"]
    image: "daprio/daprd:1.19.2"
    command:
      [
        "./daprd",
        "--max-body-size",
        "1Gi",
        "--app-id",
        "agents",
        "--app-port",
        "8000",
        "--dapr-http-port",
        "3509",
        "--dapr-grpc-port",
        "50009",
        "--scheduler-host-address",
        "scheduler:50007",
        "--resources-path",
        "/dapr/components",
        "--config",
        "/dapr/configuration/agents_monitoring_${NEMESIS_MONITORING:-disabled}.yaml",
        "--enable-metrics",
        "--dapr-graceful-shutdown-seconds",
        "5",
      ]
    volumes:
      - ./infra/dapr/components/secretstore.yaml:/dapr/components/secretstore.yaml:ro
      - ./infra/dapr/components/workflowstate.yaml:/dapr/components/workflowstate.yaml:ro
      - ./infra/dapr/configuration/:/dapr/configuration/
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      # Dapr state store: a URL with encoded credentials (its separate user/password fields are not escaped)
      - POSTGRES_STATESTORE_URL=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-enrichment}?${POSTGRES_PARAMETERS:-sslmode=disable}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-enrichment}
      - POSTGRES_PARAMETERS=${POSTGRES_PARAMETERS:-sslmode=disable}
      - HASURA_ADMIN_SECRET=${HASURA_ADMIN_SECRET:?HASURA_ADMIN_SECRET must be set in .env - tools/nemesis-ctl.sh generates one}
      - RABBITMQ_CONNECTION_STRING=amqp://${RABBITMQ_USER_URLENC:-${RABBITMQ_USER}}:${RABBITMQ_PASSWORD_URLENC:-${RABBITMQ_PASSWORD}}@rabbitmq:5672
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?}
    depends_on:
      agents: { condition: service_started }
      scheduler: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    network_mode: "service:agents"

  litellm:
    profiles: ["llm"]
    image: ghcr.io/berriai/litellm:v1.111.0
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/litellm
      - STORE_MODEL_IN_DB=True
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-east-1}
      - LITELLM_MASTER_KEY=sk-${LITELLM_ADMIN_PASSWORD:?LITELLM_ADMIN_PASSWORD must be set in .env - tools/nemesis-ctl.sh generates one}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?LITELLM_SALT_KEY must be set in .env - tools/nemesis-ctl.sh generates one}
      - SERVER_ROOT_PATH=/llm
      - PROXY_BASE_URL=${NEMESIS_URL:?}
      - UI_BASE_PATH=/llm/ui
      # Trust Traefik's X-Forwarded-Proto so LiteLLM's redirects stay on https (the port is not published)
      - FORWARDED_ALLOW_IPS=*
    volumes:
      - ./infra/litellm/config.yml:/app/config.yml:ro
    command: ["--config", "/app/config.yml"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request,json; r=urllib.request.urlopen(urllib.request.Request('http://localhost:4000/health',headers={'x-litellm-api-key':'Bearer sk-${LITELLM_ADMIN_PASSWORD}'})); d=json.load(r); exit(0 if d.get('healthy_count',0)>0 and d.get('unhealthy_count',0)==0 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging-config

  phoenix:
    profiles: ["llm"]
    image: arizephoenix/phoenix:22.1.0
    environment:
      - PHOENIX_WORKING_DIR=/data
      - PHOENIX_HOST_ROOT_PATH=/phoenix
      - PHOENIX_SQL_DATABASE_URL=postgresql://${POSTGRES_USER_URLENC:-${POSTGRES_USER}}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/phoenix
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=100
    volumes:
      - phoenix_data:/data
    # ports:
    #   - "6006:6006"  # Phoenix UI port, for debugging
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
