# hasura/metadata/tables.yaml
- table:
    name: alert_settings
    schema: public
  select_permissions:
  - role: operator
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true
  insert_permissions:
  - role: operator
    permission:
      check: {}
      columns:
      - alerting_enabled
      - category_excluded
      - category_included
      - file_path_excluded_regex
      - file_path_included_regex
      - id
      - llm_triage_values_to_alert
      - minimum_severity
  update_permissions:
  - role: operator
    permission:
      columns:
      - alerting_enabled
      - category_excluded
      - category_included
      - file_path_excluded_regex
      - file_path_included_regex
      - llm_triage_values_to_alert
      - minimum_severity
      filter: {}
      check: {}
