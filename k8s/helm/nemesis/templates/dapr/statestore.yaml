apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  type: state.postgresql
  version: v2
  metadata:
    # One URL with URL-encoded credentials. Dapr builds a key=value string from separate
    # host/user/password fields without escaping, so a password with a space or quote breaks it.
    - name: connectionString
      secretKeyRef:
        name: POSTGRES_STATESTORE_URL
        key: POSTGRES_STATESTORE_URL
    - name: actorStateStore
      value: "true"
    - name: tablePrefix
      value: "dapr_"
    - name: metadataTableName
      value: "dapr_metadata"
    - name: maxConns
      value: "10"
    - name: connectionMaxIdleTime
      value: "5m"
auth:
  secretStore: nemesis-secret-store
# Gotenberg is deliberately absent: its renderer must not reach secrets through its sidecar.
scopes:
  {{- include "nemesis.daprSecretScopes" . | nindent 2 }}
