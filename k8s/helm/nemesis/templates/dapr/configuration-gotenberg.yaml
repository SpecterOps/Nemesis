{{/*
Dapr configuration for Gotenberg. Gotenberg renders attacker-influenced HTML, and a page that reaches
the sidecar on localhost could otherwise call its secrets API; deny every secret store.
*/}}
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: gotenberg-dapr-config
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  secrets:
    scopes:
      - storeName: nemesis-secret-store
        defaultAccess: deny
      - storeName: kubernetes
        defaultAccess: deny
  metric:
    enabled: true
    http:
      increasedCardinality: false
  {{- if .Values.monitoring.enabled }}
  tracing:
    expandParams: true
    samplingRate: "1"
    otel:
      protocol: grpc
      endpointAddress: "otel-collector:4317"
      isSecure: false
  {{- end }}
