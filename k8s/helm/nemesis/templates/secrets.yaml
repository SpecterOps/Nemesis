apiVersion: v1
kind: Secret
metadata:
  name: nemesis-secrets
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.postgres.password | quote }}
  POSTGRES_HOST: "pgbouncer"
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  HASURA_DATABASE_URL: {{ include "nemesis.postgresUrl" (dict "context" . "host" "pgbouncer" "database" .Values.postgres.database) | quote }}
  S3_ACCESS_KEY: {{ .Values.credentials.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.credentials.s3.secretKey | quote }}
  RABBITMQ_USER: {{ .Values.credentials.rabbitmq.user | quote }}
  RABBITMQ_PASSWORD: {{ .Values.credentials.rabbitmq.password | quote }}
  RABBITMQ_CONNECTION_STRING: {{ printf "amqp://%s:%s@rabbitmq.%s.svc.cluster.local:5672" (include "nemesis.urlEncode" .Values.credentials.rabbitmq.user) (include "nemesis.urlEncode" .Values.credentials.rabbitmq.password) (include "nemesis.namespace" .) | quote }}
  HASURA_ADMIN_SECRET: {{ include "nemesis.hasuraAdminSecret" . | quote }}
  LITELLM_MASTER_KEY: {{ include "nemesis.litellmMasterKey" . | quote }}
  LITELLM_SALT_KEY: {{ include "nemesis.litellmSaltKey" . | quote }}
  BASIC_AUTH_USERS: {{ include "nemesis.basicAuthUsers" . | quote }}
  CHATBOT_DB_PASSWORD: "chatbot_pass_change_me"
---
# Dapr secret store file — mounted as a volume into all Dapr-enabled pods.
# Matches compose's secretstores.local.env behavior using secretstores.local.file.
apiVersion: v1
kind: Secret
metadata:
  name: nemesis-dapr-secrets
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  secrets.json: |
    {
      "HASURA_ADMIN_SECRET": {{ include "nemesis.hasuraAdminSecret" . | quote }},
      "RABBITMQ_USER": {{ .Values.credentials.rabbitmq.user | quote }},
      "RABBITMQ_PASSWORD": {{ .Values.credentials.rabbitmq.password | quote }},
      "RABBITMQ_CONNECTION_STRING": {{ include "nemesis.rabbitmqConnectionString" . | toJson }},
      "POSTGRES_USER": {{ .Values.credentials.postgres.user | quote }},
      "POSTGRES_PASSWORD": {{ .Values.credentials.postgres.password | quote }},
      "POSTGRES_HOST": "pgbouncer",
      "POSTGRES_PORT": {{ .Values.postgres.port | quote }},
      "POSTGRES_DB": {{ .Values.postgres.database | quote }},
      "POSTGRES_PARAMETERS": {{ .Values.postgres.parameters | quote }},
      "POSTGRES_STATESTORE_URL": {{ include "nemesis.postgresUrl" (dict "context" . "host" "pgbouncer" "database" .Values.postgres.database "parameters" true) | toJson }},
      "S3_ACCESS_KEY": {{ .Values.credentials.s3.accessKey | quote }},
      "S3_SECRET_KEY": {{ .Values.credentials.s3.secretKey | quote }},
      "BASIC_AUTH_USERS": {{ include "nemesis.basicAuthUsers" . | quote }},
      "CHATBOT_DB_PASSWORD": "chatbot_pass_change_me"
    }
