---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
    {{- include "nemesis.selectorLabels" (dict "name" "pgbouncer" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      {{- include "nemesis.selectorLabels" (dict "name" "pgbouncer" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nemesis.selectorLabels" (dict "name" "pgbouncer" "context" .) | nindent 8 }}
      annotations:
        dapr.io/enabled: "false"
        checksum/config: {{ printf "%s-%d-%d-%d-%d-%s" .Values.pgbouncer.poolMode (int .Values.pgbouncer.maxClientConn) (int .Values.pgbouncer.defaultPoolSize) (int .Values.pgbouncer.minPoolSize) (int .Values.pgbouncer.reservePoolSize) (default "" (ternary .Values.llm.agents.env.chatbotDbPassword "" .Values.llm.enabled)) | sha256sum }}
    spec:
      initContainers:
        {{- include "nemesis.waitForPostgres" . | nindent 8 }}
      containers:
        - name: pgbouncer
          image: {{ include "nemesis.image" (dict "image" .Values.pgbouncer.image "context" .) }}
          ports:
            - containerPort: {{ .Values.pgbouncer.port }}
              name: pgbouncer
          # edoburu/pgbouncer settings. Other roles (e.g. chatbot_readonly) are looked up in Postgres
          # through auth_user/auth_query, so no userlist entry is needed for them.
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nemesis-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nemesis-secrets
                  key: POSTGRES_PASSWORD
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: LISTEN_PORT
              value: {{ .Values.pgbouncer.port | quote }}
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: MIN_POOL_SIZE
              value: {{ .Values.pgbouncer.minPoolSize | quote }}
            - name: RESERVE_POOL_SIZE
              value: {{ .Values.pgbouncer.reservePoolSize | quote }}
            - name: ADMIN_USERS
              value: {{ .Values.credentials.postgres.user | quote }}
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
    {{- include "nemesis.selectorLabels" (dict "name" "pgbouncer" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "nemesis.selectorLabels" (dict "name" "pgbouncer" "context" .) | nindent 4 }}
  ports:
    - port: 5432
      targetPort: pgbouncer
      name: pgbouncer
