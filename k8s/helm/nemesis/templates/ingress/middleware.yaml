{{- if .Values.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-basic-auth
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: nemesis-basic-auth-secret
    # Backends never see the Nemesis password
    removeHeader: true
---
apiVersion: v1
kind: Secret
metadata:
  name: nemesis-basic-auth-secret
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  users: {{ .Values.credentials.basicAuthUsers | quote }}
---
# /rabbitmq: the Nemesis users plus the RabbitMQ account. The RabbitMQ UI (4.4+) logs in with the RabbitMQ
# credentials and then sends them in the Authorization header that basic auth reads.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-rabbitmq-auth
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: nemesis-rabbitmq-auth-secret
    # Backends never see the Nemesis password
    removeHeader: true
---
apiVersion: v1
kind: Secret
metadata:
  name: nemesis-rabbitmq-auth-secret
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
type: Opaque
stringData:
  users: |
    {{- range (splitList "," .Values.credentials.basicAuthUsers) }}
    {{- if trim . }}
    {{ trim . }}
    {{- end }}
    {{- end }}
    {{ htpasswd .Values.credentials.rabbitmq.user .Values.credentials.rabbitmq.password }}
---
# Answers every request with 403: no client address is in this range (used for cross-site requests)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-deny-all
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      - 255.255.255.255/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-strip-hasura
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /hasura
---
# The RabbitMQ management UI sends its own credentials in the Authorization header, which is also the header
# the Nemesis basic auth checks. So /rabbitmq checks the Nemesis login, then this middleware swaps in the
# RabbitMQ credentials: log in to the RabbitMQ UI with your Nemesis username and password.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-rabbitmq-credentials
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      Authorization: {{ printf "Basic %s" (printf "%s:%s" .Values.credentials.rabbitmq.user .Values.credentials.rabbitmq.password | b64enc) | quote }}
---
# For the two public endpoints the RabbitMQ UI loads before its login form (sending "Authorization: null")
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-rabbitmq-anonymous
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      Authorization: ""
{{- if .Values.llm.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nemesis-strip-phoenix
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /phoenix
{{- end }}
{{- if .Values.ingress.tls.enabled }}
---
# TLS 1.2 and 1.3 only; TLS 1.2 limited to forward-secret AEAD ciphers (no CBC/SHA-1 suites). Referenced by
# the IngressRoute, so the cluster's default TLS options stay untouched.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: nemesis-tls
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  minVersion: VersionTLS12
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
{{- end }}
{{- end }}
