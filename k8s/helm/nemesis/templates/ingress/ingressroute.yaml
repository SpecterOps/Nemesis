{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nemesis-ingress
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  {{- $hostMatch := "" }}
  {{- if .Values.ingress.host }}
  {{- $hostMatch = printf "Host(`%s`) && " .Values.ingress.host }}
  {{- end }}
  routes:
    # Refuse requests another site makes a logged-in browser send (CSRF); see
    # infra/traefik/config/cross-site.yml. Plain link-clicks into the UI (outside /api) stay allowed.
    - match: {{ $hostMatch }}(HeaderRegexp(`Sec-Fetch-Site`, `(?i)^\s*(cross-site|same-site)\s*$`) || HeaderRegexp(`Origin`, `(?i)^\s*null\s*$`)) && !((Method(`GET`) || Method(`HEAD`)) && Header(`Sec-Fetch-Mode`, `navigate`) && !PathPrefix(`/api`))
      kind: Rule
      priority: 100000
      middlewares:
        - name: nemesis-deny-all
          namespace: {{ include "nemesis.namespace" . }}
      # Never reached (the middleware answers 403); an in-namespace service, because the Traefik chart
      # rejects cross-provider references such as noop@internal by default (crossProviderNamespaces: [])
      services:
        - name: frontend
          port: {{ .Values.frontend.port }}

    # Frontend (root)
    - match: {{ $hostMatch }}PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: frontend
          port: {{ .Values.frontend.port }}

    # Web API
    - match: {{ $hostMatch }}PathPrefix(`/api`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: web-api
          port: {{ .Values.webApi.port }}

    # Hasura GraphQL
    - match: {{ $hostMatch }}PathPrefix(`/hasura`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
        - name: nemesis-strip-hasura
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: hasura
          port: 8080

    # RabbitMQ Management: Nemesis login, then the RabbitMQ credentials are swapped in
    - match: {{ $hostMatch }}PathPrefix(`/rabbitmq`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-rabbitmq-auth
          namespace: {{ include "nemesis.namespace" . }}
        - name: nemesis-rabbitmq-credentials
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: rabbitmq
          port: 15672

    # Public RabbitMQ endpoints the UI loads before its login form; they get no credentials
    - match: {{ $hostMatch }}(Path(`/rabbitmq/api/version`) || Path(`/rabbitmq/api/auth`))
      kind: Rule
      priority: 20
      middlewares:
        - name: nemesis-rabbitmq-anonymous
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: rabbitmq
          port: 15672

    {{- if .Values.monitoring.enabled }}
    # Grafana
    - match: {{ $hostMatch }}PathPrefix(`/grafana`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: grafana
          port: {{ .Values.monitoring.grafana.port }}

    # Prometheus
    - match: {{ $hostMatch }}PathPrefix(`/prometheus`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: prometheus
          port: {{ .Values.monitoring.prometheus.port }}

    # Jaeger
    - match: {{ $hostMatch }}PathPrefix(`/jaeger`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: jaeger
          port: {{ .Values.monitoring.jaeger.port }}
    {{- end }}

    {{- if .Values.jupyter.enabled }}
    # Jupyter
    - match: {{ $hostMatch }}PathPrefix(`/jupyter`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: jupyter
          port: {{ .Values.jupyter.port }}
    {{- end }}

    {{- if .Values.llm.enabled }}
    # LiteLLM
    - match: {{ $hostMatch }}PathPrefix(`/llm`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: litellm
          port: {{ .Values.llm.litellm.port }}

    # Phoenix
    - match: {{ $hostMatch }}PathPrefix(`/phoenix`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
        - name: nemesis-strip-phoenix
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: phoenix
          port: {{ .Values.llm.phoenix.port }}

    # MCP (Agents)
    - match: {{ $hostMatch }}PathPrefix(`/mcp`)
      kind: Rule
      priority: 10
      middlewares:
        - name: nemesis-basic-auth
          namespace: {{ include "nemesis.namespace" . }}
      services:
        - name: agents
          port: {{ .Values.llm.agents.mcpPort }}
    {{- end }}

  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
    options:
      name: nemesis-tls
  {{- end }}
{{- end }}
