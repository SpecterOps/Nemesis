{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        metrics_path: "/prometheus/metrics"
        static_configs:
          - targets: ["localhost:9090"]

      # Traefik runs in kube-system; the setup scripts enable its ClusterIP-only metrics Service
      - job_name: "traefik"
        static_configs:
          - targets: ["traefik-metrics.kube-system.svc.cluster.local:9100"]

      - job_name: "seaweedfs"
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets: ["seaweedfs:9324"]

      - job_name: "loki"
        static_configs:
          - targets: ["loki:3100"]

      - job_name: "node-exporter"
        static_configs:
          - targets: ["node-exporter:9100"]

      - job_name: "postgres-exporter"
        static_configs:
          - targets: ["postgres-exporter:9187"]

      - job_name: "rabbitmq"
        static_configs:
          - targets: ["rabbitmq:15692"]

      # Per-queue depth, consumers and rates (the aggregated endpoint above has totals only)
      - job_name: "rabbitmq-per-object"
        metrics_path: /metrics/per-object
        static_configs:
          - targets: ["rabbitmq:15692"]

      # Every Dapr sidecar in the namespace, one target per pod (Services would pick a random replica)
      - job_name: "dapr-sidecars"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ include "nemesis.namespace" . | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: dapr-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # App metrics from pods annotated prometheus.io/scrape=true (file-enrichment: DB pool gauges)
      - job_name: "nemesis-apps"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ include "nemesis.namespace" . | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          # One target per pod, not per declared container port
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: dapr-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Dapr scheduler replicas in dapr-system (headless Service: one A record per pod)
      - job_name: "dapr-scheduler"
        dns_sd_configs:
          - names: ["dapr-scheduler-server.dapr-system.svc.cluster.local"]
            type: A
            port: 9090

      - job_name: "gotenberg"
        metrics_path: /metrics
        static_configs:
          - targets: ["gotenberg:{{ .Values.gotenberg.metricsPort }}"]

      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector:8888"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.monitoring.prometheus.storage.storageClass }}
  storageClassName: {{ .Values.monitoring.prometheus.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
    {{- include "nemesis.selectorLabels" (dict "name" "prometheus" "context" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nemesis.selectorLabels" (dict "name" "prometheus" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nemesis.selectorLabels" (dict "name" "prometheus" "context" .) | nindent 8 }}
      annotations:
        dapr.io/enabled: "false"
    spec:
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: prometheus
          image: "{{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.external-url=/prometheus/"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
    {{- include "nemesis.selectorLabels" (dict "name" "prometheus" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "nemesis.selectorLabels" (dict "name" "prometheus" "context" .) | nindent 4 }}
  ports:
    - port: {{ .Values.monitoring.prometheus.port }}
      targetPort: http
      name: http
---
# Pod discovery for the dapr-sidecars and nemesis-apps jobs, limited to this namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: {{ include "nemesis.namespace" . }}
  labels:
    {{- include "nemesis.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ include "nemesis.namespace" . }}
{{- end }}
