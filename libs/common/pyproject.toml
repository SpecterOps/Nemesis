[project]
name = "common"
version = "0.1.0"
description = ""
authors = [{name = "SpecterOps"}]
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pydantic>=2.10.5,<3.0.0",
    "structlog>=25.1.0,<26.0.0",
    "dapr[grpc,workflow]==1.19.0",
    "minio>=7.2.14,<8.0.0",
    "fastapi>=0.136.1,<0.137.0",
    "psycopg[pool]>=3.2.9,<4.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "async-lru>=2.0.5,<3.0.0",
    "prometheus-client>=0.22.0,<1.0.0",
    "pytest>=9.0.3",
    "opentelemetry-api>=1.45.2,<2.0.0",
    "opentelemetry-sdk>=1.45.2,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<2.0.0",
    "opentelemetry-instrumentation>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-grpc>=0.66b2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-instrumentation-urllib3>=0.66b2",
    "opentelemetry-instrumentation-aiohttp-client>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
]

[dependency-groups]
dev = [
    "ruff>=0.9.2",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
