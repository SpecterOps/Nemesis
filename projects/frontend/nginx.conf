server {
    listen 3000;
    server_name localhost;

    # Root directory and index file
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache control for static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Runtime config (contains the Hasura admin secret): only for Nemesis' own pages. Another site
    # loading it as a <script> with the operator's cached login would otherwise be able to read it.
    location = /env.js {
        if ($http_sec_fetch_site ~* "^(cross-site|same-site)$") {
            return 403;
        }
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Build/version info: a real file only (never the SPA index.html fallback), never cached
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Handle React Router paths
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        
        # No cache for index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Handle 404 errors
    error_page 404 /index.html;

    # Handle 500 series errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}