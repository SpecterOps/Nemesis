cache_db_path: "~/.local/state/nemesis/connectors"
conn_timeout_sec: 5
validate_https_certs: true

nemesis:
  url: "https://nemesis.example.com"
  credential:
    username: "connector_bot"
    password: "pass"
  expiration_days: 100
  max_file_size: 1000000000
  # Optional PEM file of CAs to trust for Nemesis instead of the system trust store.
  # ca_file: "~/nemesis-ca.pem"

outflank:
  - url: "https://stage1.example.com"
    credential:
      username: "nemesis_bot"
      password: "outflank_password"
    agent_id: "stage1"
    # Optional PEM file of CAs to trust for this server instead of the system trust store.
    # ca_file: "~/outflank-ca.pem"

    # Optional:
    #   When set, stage1 downloads are retrieved from disk instead of stage1's API.
    #   The connect must be able to read files from stage1's downloads folder.
    # downloads_dir_path: "/opt/stage1/shared/downloads"
