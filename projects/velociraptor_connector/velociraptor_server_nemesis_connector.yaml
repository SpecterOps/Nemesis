name: Server.Monitor.NemesisUploadForwarder
description: |
  This monitoring artifact watches for completed file uploads from clients
  and automatically forwards them to a Nemesis server using HTTP POST.

  Configure the parameters when adding this artifact under "Server Events"
  (NemesisURL, NemesisUsername, NemesisPassword and Project are required).
  The password is a parameter with no default, so it is not stored in the
  artifact definition.

  Every upload produces one output row: forwarded, failed after all retries,
  or skipped because it is larger than MaxSize.

type: SERVER_EVENT

parameters:
  - name: NemesisURL
    description: Nemesis URL reachable from the Velociraptor server, e.g. https://nemesis:7443
    default: ""
  - name: NemesisUsername
    description: Nemesis username
    default: ""
  - name: NemesisPassword
    description: Nemesis password (no default; set it when enabling the artifact)
    default: ""
  - name: Project
    description: Nemesis project name, e.g. INVESTIGATION-123
    default: ""
  - name: AgentID
    description: Agent ID recorded in the Nemesis metadata
    default: velociraptor_server
  - name: MaxSize
    description: Maximum file size in bytes to forward (default 100 MB); larger uploads get a "Skipped" row
    type: int
    default: "100000000"
  - name: MaxAttempts
    description: Number of times to try the upload before reporting a failure
    type: int
    default: "3"
  - name: RetryDelay
    description: Seconds to wait between upload attempts
    type: int
    default: "10"
  - name: IgnoreCertErrors
    description: Skip HTTPS certificate verification (only for a self-signed Nemesis certificate; insecure)
    type: bool
    default: "N"

sources:
  - query: |
      -- Check if configuration is complete
      LET IsConfigured = NemesisURL AND NemesisUsername AND NemesisPassword AND Project

      LET AuthHeader = "Basic " + base64encode(string=NemesisUsername + ":" + NemesisPassword)

      -- Nemesis records the origin of a file as host://<hostname>, like the other connectors
      LET SourceFor(ClientId) = "host://" + (client_info(client_id=ClientId).os_info.hostname || ClientId)

      -- At least one attempt, whatever MaxAttempts is set to
      LET TotalAttempts = if(condition=MaxAttempts > 0, then=MaxAttempts, else=1)

      -- One upload attempt
      LET PostOnce(ClientId, VFSPath, UploadName, Attempt) = SELECT
          Attempt,
          Response,
          Content
        FROM http_client(
          url=NemesisURL + "/api/files",
          method="POST",
          skip_verify=IgnoreCertErrors,
          headers=dict(Authorization=AuthHeader),
          files=[
            dict(
              file=split(string=file_store(path=VFSPath), sep="/")[-1] || "unknown_file",
              key="file",
              path=file_store(path=VFSPath),
              accessor="file"
            )
          ],
          params=dict(
            metadata=serialize(
              format="json",
              item=dict(
                agent_id=AgentID,
                source=SourceFor(ClientId=ClientId),
                path=UploadName,
                project=Project,
                timestamp=timestamp(epoch=now()),
                expiration=timestamp(epoch=now() + 365 * 86400)
              )
            )
          )
        )

      -- Try up to MaxAttempts times, waiting RetryDelay seconds before each retry. Attempts run one at a
      -- time and LIMIT 1 stops at the first success, or at the last attempt when every one failed.
      LET PostWithRetry(ClientId, VFSPath, UploadName) = SELECT * FROM foreach(
          row={
            SELECT _value AS Attempt FROM range(start=0, end=TotalAttempts, step=1)
            WHERE _value = 0 OR sleep(time=RetryDelay) OR TRUE
          },
          query={
            SELECT * FROM PostOnce(ClientId=ClientId, VFSPath=VFSPath, UploadName=UploadName, Attempt=Attempt)
          })
        WHERE Response =~ "^20[0-9]$" OR Attempt >= TotalAttempts - 1
        LIMIT 1

      -- Main query that watches for uploads and forwards them
      SELECT * FROM if(
        condition=IsConfigured,
        then={
          SELECT * FROM foreach(
            row={
              SELECT
                ClientId,
                VFSPath,
                UploadName,
                Size
              FROM watch_monitoring(artifact="System.Upload.Completion")
            },
            query={
              SELECT * FROM if(
                condition=Size > MaxSize,
                then={
                  SELECT
                    ClientId,
                    SourceFor(ClientId=ClientId) AS Source,
                    UploadName,
                    Size,
                    0 AS Attempts,
                    NULL AS HTTPStatus,
                    format(format="File is %v bytes; MaxSize is %v", args=[Size, MaxSize]) AS HTTPResponse,
                    "Skipped: larger than MaxSize, not forwarded to Nemesis" AS Status
                  FROM scope()
                },
                else={
                  SELECT
                    ClientId,
                    SourceFor(ClientId=ClientId) AS Source,
                    UploadName,
                    Size,
                    Attempt + 1 AS Attempts,
                    Response AS HTTPStatus,
                    Content AS HTTPResponse,
                    if(condition=Response =~ "^20[0-9]$",
                       then="Forwarded to Nemesis",
                       else="Failed to forward to Nemesis after all attempts") AS Status
                  FROM PostWithRetry(ClientId=ClientId, VFSPath=VFSPath, UploadName=UploadName)
                })
            }
          )
        },
        else={
          SELECT
            "ERROR" AS Status,
            "CONFIGURATION REQUIRED" AS ClientId,
            "Set the NemesisURL, NemesisUsername, NemesisPassword and Project parameters when adding this artifact under Server Events" AS UploadName,
            NemesisURL AS HTTPStatus,
            format(format="Current values: URL=%s, Username=%s, Password=%s, Project=%s",
                   args=[NemesisURL, NemesisUsername, if(condition=NemesisPassword, then="<set>", else="<not set>"), Project]) AS HTTPResponse
          FROM scope()
        }
      )
