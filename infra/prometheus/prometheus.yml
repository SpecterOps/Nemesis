global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'traefik'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['traefik:8082']

  - job_name: 'seaweedfs'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['seaweedfs:9324']

  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Per-queue depth, consumers and rates (the aggregated endpoint above has totals only)
  - job_name: 'rabbitmq-per-object'
    metrics_path: '/metrics/per-object'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Reserved for enterprise edition only?
  # - job_name: 'hasura'
  #   metrics_path: '/v1/metrics'
  #   static_configs:
  #     - targets: ['hasura:8080']

  # Only file-enrichment serves app metrics (DB pool gauges). The other services have no /metrics
  # route; their Dapr sidecars (network_mode: service:<app>) serve Dapr metrics on <app>:9090:
  # pub/sub, service invocation, workflow and activity counts/latency.
  - job_name: 'nemesis-file-enrichment'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['file-enrichment:8001']

  - job_name: 'dapr-sidecars'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'web-api:9090'
          - 'file-enrichment:9090'
          - 'document-conversion:9090'
          - 'alerting:9090'
          - 'housekeeping:9090'
          - 'titus-scanner:9090'
          - 'dotnet-service:9090'
          - 'gotenberg:9090'
          - 'agents:9090' # only with the llm profile

  - job_name: 'nemesis-gotenberg'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gotenberg:9464']

  - job_name: 'nemesis-scheduler'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['scheduler:9090']

  - job_name: 'nemesis-otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'grafana'
    metrics_path: '/grafana/metrics'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'promtail'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['promtail:9080']
