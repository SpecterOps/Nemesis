# The Nemesis login (HTTP basic auth) that every router in routes.yml except the public RabbitMQ endpoints requires.
# BASIC_AUTH_USERS is a comma-separated list of user:hash entries (see env.example).
http:
  middlewares:
    auth:
      basicAuth:
        # Backends never see the Nemesis password
        removeHeader: true
        users:
{{- range $user := splitList "," (env "BASIC_AUTH_USERS") }}
{{- if trim $user }}
          - {{ trim $user | quote }}
{{- end }}
{{- end }}
