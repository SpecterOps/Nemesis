# The RabbitMQ management UI sends its own credentials in the Authorization header, which is also the
# header Traefik's Nemesis basic auth checks. So the /rabbitmq route checks the Nemesis login, then this
# middleware replaces the header with the RabbitMQ credentials: log in to the RabbitMQ UI with your
# Nemesis username and password. Only /api/version and /api/auth, which RabbitMQ serves to anyone and the UI
# loads before showing its login form, skip the Nemesis login; they get no credentials.
http:
  middlewares:
    rabbitmq-credentials:
      headers:
        customRequestHeaders:
          Authorization: 'Basic {{ printf "%s:%s" (env "RABBITMQ_USER") (env "RABBITMQ_PASSWORD") | b64enc }}'
    rabbitmq-anonymous:
      headers:
        customRequestHeaders:
          Authorization: ""
