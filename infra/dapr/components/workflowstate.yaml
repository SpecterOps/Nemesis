apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.postgresql
  version: v2
  metadata:
  # One URL with URL-encoded credentials (not named DAPR_*: the env secret store refuses those).
  # Dapr builds a key=value string from separate
  # host/user/password fields without escaping, so a password with a space or quote breaks it.
  - name: connectionString
    secretKeyRef:
      name: POSTGRES_STATESTORE_URL
      key: POSTGRES_STATESTORE_URL
  - name: actorStateStore
    value: "true"
  - name: tablePrefix
    value: "dapr_"
  - name: metadataTableName
    value: "dapr_metadata"
  # pgx defaults to max(4, NumCPU) connections; each workflow turn is one transaction
  - name: maxConns
    value: "20"
  - name: connectionMaxIdleTime
    value: "5m"
auth:
  secretStore: nemesis-secret-store
