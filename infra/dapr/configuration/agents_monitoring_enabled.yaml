apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: agents-config
spec:
  # Workflow activities and timers are driven in the sidecar instead of through scheduler reminders.
  # Don't add spec.workflow concurrency limits here: Dapr turns the fast path off when they're set.
  # Limits live in the Python SDK (WORKFLOW_MAX_CONCURRENT_* in libs/common/common/workflows/setup.py).
  features:
    - name: WorkflowsFastPath
      enabled: true
  tracing:
    expandParams: true
    samplingRate: "1"
    otel:
      protocol: grpc
      endpointAddress: "otel-collector:4317"
      isSecure: false
  metric:
    enabled: true
