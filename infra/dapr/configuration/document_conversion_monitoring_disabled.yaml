apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: document-conversion-config
spec:
  # Workflow activities and timers are driven in the sidecar instead of through scheduler reminders.
  # Don't set scheduler-enforced limits (globalMaxConcurrent*, workflowConcurrencyLimits, activityConcurrencyLimits):
  # Dapr turns the fast path off when any is set. Per-host limits live in the Python SDK
  # (WORKFLOW_MAX_CONCURRENT_* in libs/common/common/workflows/setup.py).
  workflow:
    # Dapr purges a finished workflow's state itself, after these delays (one Scheduler job per instance).
    # The app-side WorkflowPurger still runs as a safety net; it treats an already-purged instance as done.
    stateRetentionPolicy:
      completed: "60s"
      terminated: "60s"
      failed: "1h"
  features:
    - name: WorkflowsFastPath
      enabled: true
  metric:
    enabled: true
